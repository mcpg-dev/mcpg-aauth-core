[package]
name = "mcpg-aauth-core"
version = "0.1.0-beta.13"
edition = "2024"
license = "Apache-2.0"
description = "AAuth protocol primitives — Ed25519 JWKs/JWTs, RFC 9421 request signing and verification, Signature-Key schemes"

[dependencies]
ed25519-dalek = { version = "2", default-features = false, features = ["std", "fast", "zeroize"] }
getrandom = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"

[dev-dependencies]
